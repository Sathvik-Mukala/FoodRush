<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - FoodRush</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>


<body>


<!-- NAVBAR -->

<header class="navbar">

    <div class="logo">
        Food<span>Rush</span>
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="customer/restaurants.html">
            Restaurants
        </a>

    </nav>

    <div class="nav-buttons">

        <a href="login.html"
           class="login-btn">

            Login

        </a>

    </div>

</header>



<!-- REGISTER -->

<main class="auth-page">

    <div class="auth-container">


        <div class="auth-info">

            <div class="logo">
                Food<span>Rush</span>
            </div>

            <h1>
                Join FoodRush
            </h1>

            <p>
                Create an account and start ordering
                delicious food.
            </p>

            <div class="auth-food">
                🍕 🍔 🍰
            </div>

        </div>



        <div class="auth-form">

            <h2>
                Create Account
            </h2>

            <p class="form-subtitle">
                Fill in your details to register
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="registerName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="registerEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="registerPhone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="Enter 10 digit phone number"
                        maxlength="10"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button">

                    Create Account

                </button>


            </form>


            <p class="switch-auth">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>

</main>


<script src="js/utils.js"></script>
<script src="js/auth.js"></script>

</body>

</html>
